<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  :root { color-scheme: light dark; --bd: #8884; --accent: #2563eb; }
  body { font: 13px system-ui, sans-serif; width: 340px; margin: 0; padding: 12px; }
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  h1 { font-size: 15px; margin: 0; }
  ul { list-style: none; margin: 0 0 10px; padding: 0; }
  li { display: flex; align-items: center; gap: 6px; padding: 6px 0; border-bottom: 1px solid var(--bd); }
  li span { flex: 1; word-break: break-all; }
  li small { opacity: .6; }
  form { display: grid; gap: 6px; }
  input[type=text] { padding: 5px 6px; border: 1px solid var(--bd); border-radius: 4px; font: inherit; background: transparent; color: inherit; }
  button { cursor: pointer; font: inherit; }
  form button { background: var(--accent); color: #fff; border: 0; border-radius: 4px; padding: 6px; }
  li button { background: none; border: 0; color: inherit; opacity: .6; }
  #err { color: #dc2626; min-height: 1em; }
  .hint { opacity: .6; font-size: 11px; }
</style>
</head>
<body>
<header>
  <h1>Link Sanitizer</h1>
  <label><input type="checkbox" id="enabled"> On</label>
</header>
<ul id="list"></ul>
<form id="form">
  <input type="text" id="origin" placeholder="From site, e.g. chatgpt.com (empty = any)">
  <input type="text" id="remove" placeholder="Remove, e.g. ?utm_source=chatgpt.com" required>
  <label><input type="checkbox" id="referer" checked> Also hide where I came from (Referer)</label>
  <button>Add rule</button>
  <div id="err"></div>
  <div class="hint">Leave out “=value” to remove the parameter whatever its value.</div>
</form>
<script src="popup.js"></script>
</body>
</html>
